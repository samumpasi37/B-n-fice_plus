<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-mail confirmé — Bénéfice Plus</title>
<style>
  :root { --accent: #1F7A4D; --accent-dark: #16593a; --bg: #f6f8f7; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 16px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 8px; color: var(--accent-dark); }
  p { color: #555; font-size: 0.95rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Adresse e-mail confirmée !</h1>
    <p>Vous pouvez fermer cette page et retourner dans l'application Bénéfice Plus pour vous connecter.</p>
  </div>
</body>
</html>
