<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nouveau mot de passe — Bénéfice Plus</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --accent: #1F7A4D; --accent-dark: #16593a; --bg: #f6f8f7; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    text-align: center;
  }
  h1 { font-size: 1.3rem; margin: 0 0 8px; color: var(--accent-dark); }
  p { color: #555; font-size: 0.95rem; margin-bottom: 20px; }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #d7dbd8;
    font-size: 1rem;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 14px; font-size: 0.9rem; }
  .msg.error { color: #c0392b; }
  .msg.success { color: var(--accent-dark); }
</style>
</head>
<body>

<div class="card">
  <h1>Choisissez un nouveau mot de passe</h1>
  <p>Entrez votre nouveau mot de passe pour votre compte Bénéfice Plus.</p>

  <input id="password" type="password" placeholder="Nouveau mot de passe (6 caractères min.)" />
  <input id="password2" type="password" placeholder="Confirmez le mot de passe" />
  <button id="submit-btn">Enregistrer le nouveau mot de passe</button>
  <div id="msg" class="msg"></div>
</div>

<script>
  const SUPABASE_URL = 'https://gldxzpqyyukqwjzpsmas.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsZHh6cHF5eXVrcXdqenBzbWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MzA4MTQsImV4cCI6MjEwNDMwNjgxNH0.dc4-riViHuj1mx1RCcbmJTMIxNy6cszuyyVss3b752k';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + type;
  }

  // Supabase place le jeton de récupération dans le fragment de l'URL (#access_token=...)
  // Le SDK Supabase JS le détecte et crée automatiquement une session temporaire.
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      showMsg('Lien vérifié, vous pouvez choisir votre nouveau mot de passe.', 'success');
    }
  });

  btn.addEventListener('click', async () => {
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;

    if (p1.length < 6) {
      showMsg('Le mot de passe doit faire au moins 6 caractères.', 'error');
      return;
    }
    if (p1 !== p2) {
      showMsg('Les deux mots de passe ne correspondent pas.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Enregistrement...';

    const { error } = await supabase.auth.updateUser({ password: p1 });

    btn.disabled = false;
    btn.textContent = 'Enregistrer le nouveau mot de passe';

    if (error) {
      showMsg("Erreur : le lien a peut-être expiré. Redemandez un e-mail depuis l'app.", 'error');
    } else {
      showMsg('Mot de passe changé avec succès ! Retournez dans l\'app pour vous connecter.', 'success');
      document.getElementById('password').value = '';
      document.getElementById('password2').value = '';
    }
  });
</script>

</body>
</html>
